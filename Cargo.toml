[package]
name = "rustito"
version = "0.1.0"
edition = "2024"
description = "A lightweight cross-platform system cockpit written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arafat877/rustito"

[dependencies]
sysinfo = "0.37"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"